# Every Monday, saves new NBER and CEPR papers and articles in 8 journals (top 5, JEL, JEP,
# Annual Review of Economics) into routines/flux.json, titles and links only
# (scripts/collect_feeds.py). Looks back 60 days, so a missed week is caught up. If a source
# fails, the rest is still committed and the run is marked as failed (GitHub sends an email).
name: Collect academic feeds
on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: feeds
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/collect_feeds.py
      - name: Commit new items
        if: ${{ !cancelled() }}
        run: |
          git config user.name "living-review-bot"; git config user.email "actions@users.noreply.github.com"
          git add routines/flux.json
          if git diff --cached --quiet; then echo "no new items"; exit 0; fi
          git commit -m "Flux académiques : relevé du $(date -u +%F) [skip ci]" && git pull --rebase && git push
