# Saves new NBER, CEPR and journal items (top 5, JEL, JEP, Annual Review of Economics) every
# Monday into routines/flux.json (scripts/collect_feeds.py). The feeds only go back one to two
# weeks, so the monthly routine reads this file instead of the feeds themselves.
name: Collect academic feeds
on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: feeds
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/collect_feeds.py
      - name: Commit new items
        run: |
          git config user.name "living-review-bot"; git config user.email "actions@users.noreply.github.com"
          git add routines/flux.json
          if git diff --cached --quiet; then echo "no new items"; exit 0; fi
          git commit -m "Flux académiques : relevé du $(date -u +%F) [skip ci]" && git pull --rebase && git push
