  ref: "Fieldhouse, A. J. et K. Mertens (2026), « The Returns to Government R&D: Evidence from US Appropriations Shocks », *American Economic Review*, 116(11), p. 3959-4002."
  url: "https://doi.org/10.1257/aer.20231684"
  type: académique
  avis: citer
  ou: "2.1.A, p. 232-233, et 3.3, p. 258 (R&D publique)"
  motif: "À partir d'une classification narrative des grands changements de crédits de R&D de cinq agences fédérales américaines depuis la guerre, une hausse des crédits non militaires accroît à long terme l'innovation et la productivité du secteur des entreprises, avec un rendement implicite de 140 à 210 % sur l'après-guerre, la R&D financée par l'État expliquant un cinquième de la croissance de la PGF des entreprises depuis la Seconde Guerre mondiale."
- date: "2026-11-04"
  ref: "Aghion, P., A. Bergeaud, M. De Ridder et J. Van Reenen (2026), « Lost in Transition: Financial Barriers to New Technologies », CEPR DP 22137."
  url: "https://cepr.org/publications/dp22137"
  type: académique
  avis: citer
  ou: "4.3, p. 262, et 2.2.B, p. 238-239 (financement des jeunes entreprises)"
  motif: "L'innovation dans les technologies nouvelles est plus sensible au durcissement des conditions financières que celle dans les technologies mûres, car les jeunes entreprises, plus contraintes, s'y spécialisent ; d'après les brevets verts des entreprises allemandes autour de la crise financière mondiale, le ralentissement de l'orientation des jeunes entreprises vers les technologies nouvelles explique environ un cinquième de l'évolution macroéconomique de l'innovation verte."
- date: "2026-11-13"
  ref: "Bach, L., A. Bozio, A. Guillouzouic, C. Leroy et C. Malgouyres (2026), « A Closely-Held View of Dividend Taxation », CEPR DP 22173."
