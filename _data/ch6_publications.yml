  type: académique
  avis: citer
  ou: "3.1.C, p. 250-251 (fiscalité du capital et investissement)"
  motif: "Avec des données fiscales appariées actionnaires-entreprises et deux réformes françaises (hausse de l'imposition des dividendes en 2013, baisse en 2018), les versements de dividendes réagissent très fortement mais l'investissement est insensible à cette fiscalité, les variations de versements étant absorbées par les bénéfices non distribués."
