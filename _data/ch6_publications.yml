  type: académique
  avis: mentionner
  ou: "2.1.B, p. 233-234 (effets de l'IA au niveau micro)"
  motif: "Plateforme chinoise de commerce en ligne, entreprises de moins de 5 millions de yuans de ventes annuelles : l'adoption d'outils d'IA générative accroît les ventes mensuelles de 51,6 % par rapport à des entreprises comparables, surtout chez les plus petites."
