  motif: "Sur 116 795 start-up fondées entre 2015 et 2022 dans 172 pays, les start-up d'IA lèvent chaque année 151 % de capitaux de plus que les autres start-up en Amérique du Nord, contre 16 % de plus en Europe (il s'agit d'un écart entre start-up d'une même région, non d'un écart de niveau entre régions)."
