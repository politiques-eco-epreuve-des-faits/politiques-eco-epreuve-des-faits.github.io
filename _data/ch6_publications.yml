  motif: "Sur 530 471 protéines suivies de 2017 à 2025, là où les prédictions d'AlphaFold2 sont plus fiables, l'activité expérimentale après 2021 produit moins de premières structures pour les protéines éloignées de toute structure connue et davantage d'expériences de suivi sur des protéines de structure déjà connue, par rapport aux protéines aux prédictions moins fiables : l'IA peut approfondir les connaissances existantes plutôt que les étendre."
- date: "2026-11"
  ref: "Barwick, P. J., L. Fang, J. Liu, H. Xu et Z. Yuan (2026), « AI as Shared Business Infrastructure: Firm Growth and the Distribution of Gains », NBER WP 36003."
