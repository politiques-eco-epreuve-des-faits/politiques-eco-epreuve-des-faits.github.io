  ou: "3.1, p. 246 (application du droit de la concurrence)"
  motif: "À partir d'un recensement narratif de toutes les poursuites antitrust fédérales (DoJ et FTC) depuis le milieu des années 1950, une application plus stricte du droit de la concurrence accroît la production, le capital de R&D et les brevets et améliore l'efficacité allocative ; pour les fusions civiles, la production augmente sans hausse durable des intrants."
